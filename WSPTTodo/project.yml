name: WSPTTodo
options:
  bundleIdPrefix: com.douglassmurray.wspttodo
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 6KS6QV784T
packages:
  WSPTCore:
    path: ../WSPTCore
targets:
  WSPTTodo:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: WSPTTodo
    dependencies:
      - package: WSPTCore
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: WSPT Todo
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: Generated/WSPTTodo.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.douglassmurray.wspttodo
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.douglassmurray.wspttodo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
