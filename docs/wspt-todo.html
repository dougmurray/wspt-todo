<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priority Queue</title>
<style>
  :root {
    --bg: #12151a;
    --panel: #1a1f26;
    --panel-raised: #1f242c;
    --border: #262c34;
    --border-strong: #333b45;
    --text-primary: #e6e4dd;
    --text-secondary: #8a93a0;
    --text-muted: #5c6470;
    --amber: #e8a33d;
    --amber-dim: #6b5327;
    --teal: #4fc3b0;
    --teal-dim: #2a5850;
    --danger: #d9695f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    padding: 28px 18px 60px;
    min-height: 100vh;
  }

  .wrap { max-width: 640px; margin: 0 auto; }

  .eyebrow-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .formula {
    font-family: "SFMono-Regular", "IBM Plex Mono", Menlo, monospace;
    font-size: 12px;
    color: var(--amber);
    background: var(--amber-dim);
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .subtitle {
    color: var(--text-secondary);
    font-size: 13px;
    margin: 0 0 22px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 24px;
  }

  .field-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }

  .field {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field label {
    font-size: 11px;
    color: var(--text-muted);
  }

  input[type="text"], input[type="number"], select {
    background: var(--panel-raised);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    color: var(--text-primary);
    padding: 9px 10px;
    font-size: 14px;
    font-family: inherit;
    width: 100%;
  }

  input[type="text"]:focus, input[type="number"]:focus, select:focus {
    outline: none;
    border-color: var(--amber);
  }

  input[type="number"] { font-family: "SFMono-Regular", "IBM Plex Mono", Menlo, monospace; }

  .add-btn {
    width: 100%;
    background: var(--amber);
    color: #1a1206;
    border: none;
    border-radius: 6px;
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }

  .add-btn:active { transform: scale(0.99); }

  .error-msg {
    color: var(--danger);
    font-size: 12px;
    margin: -4px 0 8px;
    display: none;
  }

  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .list-header h2 {
    font-size: 13px;
    text-transform: none;
    color: var(--text-secondary);
    font-weight: 500;
    margin: 0;
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    padding: 40px 10px;
    border: 1px dashed var(--border-strong);
    border-radius: 10px;
  }

  .item {
    display: flex;
    align-items: stretch;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    overflow: hidden;
  }

  .item.done { opacity: 0.45; }

  .score-col {
    width: 64px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--panel-raised);
    border-right: 1px solid var(--border);
    padding: 6px 4px;
  }

  .score-val {
    font-family: "SFMono-Regular", "IBM Plex Mono", Menlo, monospace;
    font-size: 16px;
    font-weight: 600;
    color: var(--teal);
    line-height: 1.1;
  }

  .score-label {
    font-size: 9px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .item-body {
    flex: 1;
    padding: 10px 12px;
    min-width: 0;
  }

  .item-name {
    font-size: 14px;
    font-weight: 500;
    margin: 0 0 4px;
    word-break: break-word;
  }

  .item.done .item-name { text-decoration: line-through; }

  .item-meta {
    display: flex;
    gap: 10px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .item-meta span { display: flex; align-items: center; gap: 3px; }

  .item-actions {
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
  }

  .item-actions button {
    flex: 1;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text-secondary);
    width: 40px;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .item-actions button:last-child { border-bottom: none; }
  .item-actions button:hover { background: var(--panel-raised); color: var(--text-primary); }
  .item-actions button.del:hover { color: var(--danger); }
  .item-actions button.chk:hover { color: var(--teal); }

  .importance-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow-row">
    <h1>Priority queue</h1>
    <span class="formula">P = I / (2×t)</span>
  </div>
  <p class="subtitle">Ordered by weighted shortest processing time. Highest score first.</p>

  <div class="panel">
    <div class="field-row">
      <div class="field" style="flex: 2;">
        <label for="task-name">Task</label>
        <input type="text" id="task-name" placeholder="Recalibrate the magnetometer rig">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="task-time">Estimated time (hrs)</label>
        <input type="number" id="task-time" placeholder="2" min="0" step="0.25">
      </div>
      <div class="field">
        <label for="task-importance">Importance</label>
        <select id="task-importance">
          <option value="1">1 — Trivial</option>
          <option value="2">2 — Low</option>
          <option value="3" selected>3 — Normal</option>
          <option value="4">4 — High</option>
          <option value="5">5 — Critical</option>
        </select>
      </div>
    </div>
    <p class="error-msg" id="error-msg"></p>
    <button class="add-btn" id="add-btn">Add task</button>
  </div>

  <div class="list-header">
    <h2 id="list-count">0 open tasks</h2>
  </div>

  <div id="list"></div>

</div>

<script>
  var tasks = [];
  var nextId = 1;

  function computeScore(importance, time) {
    if (time <= 0) return Infinity;
    return importance / (2.0 * time);
  }

  function formatScore(score) {
    if (score === Infinity) return "\u221e";
    return score.toFixed(2);
  }

  function render() {
    var list = document.getElementById('list');
    var open = tasks.filter(function(t) { return !t.done; });
    var done = tasks.filter(function(t) { return t.done; });

    var sorted = open.slice().sort(function(a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return a.createdAt - b.createdAt;
    }).concat(done.slice().sort(function(a, b) { return a.createdAt - b.createdAt; }));

    document.getElementById('list-count').textContent = open.length + (open.length === 1 ? ' open task' : ' open tasks');

    if (tasks.length === 0) {
      list.innerHTML = '<div class="empty-state">No tasks yet. Add one above to see it ranked.</div>';
      return;
    }

    list.innerHTML = '';
    sorted.forEach(function(t) {
      var item = document.createElement('div');
      item.className = 'item' + (t.done ? ' done' : '');

      var scoreCol = document.createElement('div');
      scoreCol.className = 'score-col';
      scoreCol.innerHTML = '<div class="score-val">' + formatScore(t.score) + '</div><div class="score-label">score</div>';

      var body = document.createElement('div');
      body.className = 'item-body';

      var name = document.createElement('p');
      name.className = 'item-name';
      name.textContent = t.name;

      var meta = document.createElement('div');
      meta.className = 'item-meta';
      meta.innerHTML =
        '<span>' + t.time + ' hr' + (t.time === 1 ? '' : 's') + '</span>' +
        '<span>' + importanceLabel(t.importance) + '</span>';

      body.appendChild(name);
      body.appendChild(meta);

      var actions = document.createElement('div');
      actions.className = 'item-actions';

      var chk = document.createElement('button');
      chk.className = 'chk';
      chk.setAttribute('aria-label', t.done ? 'Mark as not done' : 'Mark as done');
      chk.textContent = t.done ? '\u21b6' : '\u2713';
      chk.onclick = function() { toggleDone(t.id); };

      var del = document.createElement('button');
      del.className = 'del';
      del.setAttribute('aria-label', 'Delete task');
      del.textContent = '\u2715';
      del.onclick = function() { deleteTask(t.id); };

      actions.appendChild(chk);
      actions.appendChild(del);

      item.appendChild(scoreCol);
      item.appendChild(body);
      item.appendChild(actions);
      list.appendChild(item);
    });
  }

  function importanceLabel(v) {
    var labels = {1: 'Trivial', 2: 'Low', 3: 'Normal', 4: 'High', 5: 'Critical'};
    return labels[v] || v;
  }

  function toggleDone(id) {
    var t = tasks.find(function(x) { return x.id === id; });
    if (t) t.done = !t.done;
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(function(x) { return x.id !== id; });
    render();
  }

  function showError(msg) {
    var el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function clearError() {
    document.getElementById('error-msg').style.display = 'none';
  }

  document.getElementById('add-btn').addEventListener('click', function() {
    var nameEl = document.getElementById('task-name');
    var timeEl = document.getElementById('task-time');
    var importanceEl = document.getElementById('task-importance');

    var name = nameEl.value.trim();
    var time = parseFloat(timeEl.value);
    var importance = parseInt(importanceEl.value, 10);

    if (!name) { showError('Enter a task name first.'); return; }
    if (isNaN(time) || time <= 0) { showError('Enter an estimated time greater than zero.'); return; }

    clearError();

    tasks.push({
      id: nextId++,
      name: name,
      time: time,
      importance: importance,
      score: computeScore(importance, time),
      done: false,
      createdAt: Date.now()
    });

    nameEl.value = '';
    timeEl.value = '';
    importanceEl.value = '3';
    nameEl.focus();

    render();
  });

  document.getElementById('task-name').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('add-btn').click();
  });
  document.getElementById('task-time').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('add-btn').click();
  });

  render();
</script>
</body>
</html>
